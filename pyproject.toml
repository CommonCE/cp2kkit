[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cp2kkit"
version = "0.3.6"
description = "CP2K analysis and non-destructive input generation with explicit units and provenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
ui = ["rich>=13.7"]

[project.scripts]
cp2kkit = "cp2kkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
